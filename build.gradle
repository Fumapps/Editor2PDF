plugins {
    id 'java'
}

ext.languageName = "Editor2PDF"
ext.mpsVersion = "2026.1"
ext.antBuildFile = "Editor2PDF.xml"

ext.mpsPlugins = [ ]
ext.customMpsPlugins = [
        "de.itemis.mps.extensions": "https://artifacts.itemis.cloud/repository/maven-mps/de/itemis/mps/extensions/2026.1.3712.45fabf4/extensions-2026.1.3712.45fabf4.zip"
]

configurations.all {
    transitive = false
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'com.itextpdf:itext-pdfa:5.5.13.3'
    implementation 'com.itextpdf:itext-xtra:5.5.13.3'
    implementation 'com.itextpdf:itextpdf:5.5.13.3:sources'
    implementation 'com.itextpdf:itext-pdfa:5.5.13.3:sources'
    implementation 'com.itextpdf:itext-xtra:5.5.13.3:sources'
    implementation 'com.itextpdf:itextpdf:5.5.13.3:javadoc'
    implementation 'com.itextpdf:itext-pdfa:5.5.13.3:javadoc'
    implementation 'com.itextpdf:itext-xtra:5.5.13.3:javadoc'
    implementation 'org.jfree:jfreesvg:3.4.3'
}

task copyDeps {
    doLast {
        copy {
            from configurations.compileClasspath
            into 'solutions/com.itext'
            include 'itext*.jar'
        }
        copy {
            from configurations.compileClasspath
            into 'solutions/org.jfreesvg'
            include 'jfreesvg*.jar'
        }
    }
}

apply from: 'gradle/init-gradle-scripts.gradle'

task prepareMps {
    group 'mps'
    dependsOn 'buildOsSpecificBundle'
}

task mpsBuild {
    group 'mps'
    dependsOn 'mpsAntGenerate', 'mpsAntBuild'
}

task mpsClean {
    group 'mps'
    dependsOn 'mpsAntClean', 'mpsAntCleanSources'
}

task mpsTest {
    group 'mps'
    dependsOn 'mpsAntCheck', 'parseTestReportAfterAntCheck'
}

task openProjectInMps {
    group 'mps'
    dependsOn 'mpsOpenProjectInMpsForCurrentOs'
}

task buildAndOpenProjectInMps {
    group 'mps'
    dependsOn mpsBuild, openProjectInMps
}

mpsAntGenerate.dependsOn copyDeps
